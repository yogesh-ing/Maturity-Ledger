org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true

android.useAndroidX=true
android.nonTransitiveRClass=true

kotlin.code.style=official

# The Kotlin compile daemon cannot open its loopback RMI socket on some Windows machines (firewall
# rules, restricted loopback). Compile in the Gradle process instead; builds stay correct, just
# slower on big projects.
kotlin.compiler.execution.strategy=in-process
